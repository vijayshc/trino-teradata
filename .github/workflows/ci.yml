name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build plugin (skip integration tests)
        run: mvn -pl trino-plugin -am clean package -DskipTests -B

      - name: Compile integration tests
        run: mvn -pl testing/trino-tests -am test-compile -B
