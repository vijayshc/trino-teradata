name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build plugin (trino-plugin packaging + unit tests)
        run: ./mvnw -B -pl plugin/trino-teradata -am clean verify -DskipITs

      - name: Compile integration tests
        run: ./mvnw -B -pl testing/trino-teradata-tests -am test-compile

      - name: Verify Apache license headers present
        run: |
          missing=$(find plugin testing -name '*.java' -print0 | xargs -0 grep -L 'Licensed under the Apache License' || true)
          if [ -n "$missing" ]; then
            echo "Missing Apache license header in:"
            echo "$missing"
            exit 1
          fi
